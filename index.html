<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortner and cleaner</title>
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="url-cleaner">
      <p>
        Hi Please enter your title of contents we can shrink or make it readable
      </p>
      <input id="title-input" />
      <button id="clean-btn">Click here to clean the Title</button>
      <output id="result"></output>
    </div>

    <p>
      Learning about DOM document.createElement() method i made a new div
      container
    </p>

    <!-- Now with .setAttribute(name, value) method you can change values  and set attributes of an elemebnt 
     on the go using Js-->
    <input type="text" id="myInput" value="bottles" />

    <h2 id="title">Welcome to H20 DECAFF</h2>

    <!-- This is how we can append in a ul list using 
     appendChild technique in Js -->

    <ul id="myList">
      <li>Apple</li>
    </ul>

    <script type="module" src="slugGenerator.js"></script>
    <script type="module" src="day10.js"></script>
    <script type="text/javascript">
      let newElement = document.createElement("input");
      document.body.appendChild(newElement);

      document
        .getElementById("myInput")
        .setAttribute("value", "Sparkling WATER!!");

      // now creating a similar example with new HTML element
      const myElement = document.createElement("div");
      myElement.setAttribute("class", "decode-caff");
      document.body.appendChild(myElement);
      console.log(myElement);
    </script>
    <script type="module" src="day14.js"></script>
    <script type="module" src="friday14.js"></script>
  </body>
</html>
